# ─────────────────────────────────────────
#  IBM Code Analyzer — Application Config
# ─────────────────────────────────────────

server.port=${PORT:8080}
spring.application.name=ibm-code-analyzer

# ── File Upload ──────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Async Thread Pool ────────────────────
analyzer.async.core-pool-size=4
analyzer.async.max-pool-size=10
analyzer.async.queue-capacity=25

# ── Temporary work directory ─────────────
analyzer.work-dir=/tmp/code-analyzer

# ── LLM Provider: watsonx (default) or openai or anthropic ──
llm.provider=watsonx

# IBM watsonx config
llm.watsonx.api-url=${WATSONX_API_URL}
llm.watsonx.api-key=${WATSONX_API_KEY}
llm.watsonx.project-id=${WATSONX_PROJECT_ID}
llm.watsonx.model-id=${WATSONX_MODEL_ID}

# ── LLM Tuning ───────────────────────────
llm.max-tokens=2000
llm.chunk-size-chars=8000
llm.timeout-seconds=60

# ── Security Scan ────────────────────────
# Semgrep CLI path (optional, falls back to rule-based scan)
security.semgrep.enabled=false
security.semgrep.binary=semgrep

# ── Actuator ─────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ──────────────────────────────
logging.level.com.ibm.codeanalyzer=DEBUG
logging.level.org.springframework.web=INFO
