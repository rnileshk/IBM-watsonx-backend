# ─────────────────────────────────────────
#  IBM Code Analyzer — Application Config
# ─────────────────────────────────────────

server.port=8080
spring.application.name=ibm-code-analyzer

# ── File Upload ──────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Async Thread Pool ────────────────────
analyzer.async.core-pool-size=4
analyzer.async.max-pool-size=10
analyzer.async.queue-capacity=25

# ── Temporary work directory ─────────────
analyzer.work-dir=/tmp/code-analyzer

# ── LLM Provider: watsonx (default) or openai or anthropic ──
llm.provider=anthropic

# IBM watsonx config
llm.watsonx.api-url=https://us-south.ml.cloud.ibm.com/ml/v1/text/generation
llm.watsonx.api-key=YOUR_WATSONX_API_KEY
llm.watsonx.project-id=YOUR_PROJECT_ID
llm.watsonx.model-id=ibm/granite-13b-instruct-v2

# OpenAI config (alternative)
llm.openai.api-url=https://api.openai.com/v1/chat/completions
llm.openai.api-key=YOUR_OPENAI_API_KEY
llm.openai.model=gpt-4o

# Anthropic config (alternative)
llm.anthropic.api-url=https://api.anthropic.com/v1/messages
llm.anthropic.api-key=YOUR_ANTHROPIC_API_KEY
llm.anthropic.model=claude-sonnet-4-20250514

# ── LLM Tuning ───────────────────────────
llm.max-tokens=2000
llm.chunk-size-chars=8000
llm.timeout-seconds=60

# ── Security Scan ────────────────────────
# Semgrep CLI path (optional, falls back to rule-based scan)
security.semgrep.enabled=false
security.semgrep.binary=semgrep

# ── Actuator ─────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ──────────────────────────────
logging.level.com.ibm.codeanalyzer=DEBUG
logging.level.org.springframework.web=INFO
